name: Report a bug with Staccato
description: Report a bug with Staccato
title: "[Bug]: "
labels: ["bug"]
projects: ["staccatoapp/2"]
type: bug
body:
  - type: checkboxes
    attributes:
      label: I have searched the existing issues, both open and closed, to make sure this is not a duplicate report.
      options:
        - label: "Yes"
          required: true
  - type: markdown
    attributes:
      value: |
        This issue form is for reporting bugs only!

        If you have a feature or enhancement request, please go back and use the feature request template instead.
  - type: textarea
    validations:
      required: true
    attributes:
      label: The bug
      description: >-
        Describe the issue you are experiencing here, to communicate to the
        maintainers. Tell us what you were trying to do and what happened.

        Provide a clear and concise description of what the problem is.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: input
    validations:
      required: true
    attributes:
      label: The OS that Staccato is running on
      placeholder: Ubuntu 22.10
  - type: input
    id: version
    validations:
      required: true
    attributes:
      label: Version of Staccato
      placeholder: v1.0.0
  - type: input
    attributes:
      label: Version of Staccato Mobile (if applicable)
      placeholder: v1.0.0
  - type: checkboxes
    validations:
      required: true
    attributes:
      label: Platform(s) with the issue
      options:
        - label: Server
        - label: Web
        - label: Mobile
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem. (Please DO NOT upload any copyrighted material.)
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional information
      description: If you have any additional information for us, use the field below.
  - type: markdown
    attributes:
      value: Thank you for your report!
